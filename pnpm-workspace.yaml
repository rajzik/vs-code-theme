packages:
  - packages/*

catalog:
  '@changesets/changelog-github': ^0.7.0
  '@changesets/cli': ^2.31.1
  '@rajzik/oxfmt-config': 4.0.4
  '@rajzik/oxlint-config': 4.0.4
  '@vscode/vsce': 3.9.2
  ovsx: 1.0.2
  oxfmt: 0.60.0
  oxlint: 1.75.0
  oxlint-tsgolint: 7.0.2001
  prettier: ^3.9.6
  turbo: ^2.10.7
  vitest: 4.1.10

catalogMode: prefer

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - rajzik-theme
  - '@vscode/vsce'
  - '@rajzik/oxfmt-config'
  - '@rajzik/oxlint-config'
  - '@rajzik/configs-shared'

onlyBuiltDependencies:
  - '@vscode/vsce-sign'
  - keytar

savePrefix: ''
