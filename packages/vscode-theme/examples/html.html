<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rajzik Dark syntax highlighting preview" />
    <title>Rajzik Dark — HTML Sample</title>
    <link
      rel="stylesheet"
      href="styles.css" />
    <script
      defer
      src="app.js"></script>
  </head>
  <body
    class="theme-preview"
    data-theme="rajzik-dark">
    <header
      id="site-header"
      role="banner">
      <h1 class="title">Syntax Preview</h1>
      <nav aria-label="Primary">
        <ul>
          <li><a href="#overview">Overview</a></li>
          <li><a href="#tokens">Tokens</a></li>
          <li>
            <a
              href="#usage"
              target="_blank"
              rel="noopener"
              >Usage</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main id="content">
      <section id="overview">
        <h2>Overview</h2>
        <p>
          This page exercises <strong>HTML</strong> scopes: tags, attributes,
          and <em>tag punctuation</em>.
        </p>
        <img
          src="rajzik-logo.png"
          alt="Rajzik logo"
          width="64"
          height="64"
          loading="lazy" />
      </section>

      <section id="tokens">
        <h2>Form elements</h2>
        <form
          action="/submit"
          method="post">
          <label for="theme-select">Theme</label>
          <select
            id="theme-select"
            name="theme"
            required>
            <option
              value="rajzik-dark"
              selected>
              Rajzik Dark
            </option>
            <option value="system">System</option>
          </select>

          <label for="notes">Notes</label>
          <textarea
            id="notes"
            name="notes"
            rows="4"
            placeholder="Optional feedback"></textarea>

          <button
            type="submit"
            class="btn btn-primary">
            Save
          </button>
        </form>
      </section>

      <!-- Custom element with boolean attribute -->
      <theme-switcher enabled></theme-switcher>
    </main>

    <footer>
      <p>&copy; 2026 Rajzik Theme</p>
    </footer>
  </body>
</html>
